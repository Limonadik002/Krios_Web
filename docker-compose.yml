services:
  postgres:
    image: postgres:15-alpine
    container_name: krios_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - krios_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krios_backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - krios_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEM_LIMIT:-512M}
        reservations:
          memory: ${BACKEND_MEM_RESERVE:-128M}

  frontend:
    build:
      context: ./front/my-app
      dockerfile: Dockerfile
    container_name: krios_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - krios_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEM_LIMIT:-256M}
        reservations:
          memory: ${FRONTEND_MEM_RESERVE:-64M}

volumes:
  postgres_data:

networks:
  krios_network:
    driver: bridge